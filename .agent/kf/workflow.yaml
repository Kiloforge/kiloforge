tdd:
  strictness: strict
  description: Tests required before implementation (highly recommended for fully autonomous agents)

commits:
  strategy: conventional
  description: Conventional Commits (feat:, fix:, chore:, etc.)

code_review:
  required: false
  description: Optional / self-review OK

verification:
  checkpoints: track_completion
  commands: "make verify"
  pre_commands: "cd backend && gofmt -w . && goimports -w -local github.com/benbaldivia/crelay ."
  description: >
    All builds, tests, and lints must pass before merging. Run pre_commands
    first to autoformat, then commands to verify. Nothing merges to main
    unless 'make verify' passes (runs test + build + lint).
