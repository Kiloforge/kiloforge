title: "Remove skills panel, banner, and install dialog from Command Deck"
type: chore
status: pending
created: 2026-03-13
updated: 2026-03-13
spec:
  summary: "Strip all frontend skills UI (SkillsPalette, SkillsBanner, SkillsInstallDialog, SlashCommandAutocomplete, useSkillsStatus, useSkillsPrompt, SKILL_REGISTRY) and their integrations in App.tsx, ProjectPage, AgentTerminal, and AgentLauncher. Skills/slash commands are handled natively by Claude Code in the terminal — the custom UI layer is redundant."
  context: |
    The Command Deck has a custom skills UI layer that duplicates what Claude Code
    already provides natively in the terminal. This includes:
    - A SkillsPalette sidebar showing installed/available skills
    - A SkillsBanner prompting installation/updates
    - A SkillsInstallDialog modal triggered by 412 responses
    - A SlashCommandAutocomplete dropdown in the chat input
    - A "Skills" button in the navigation header
    Users should see slash commands natively in their Claude session, not through
    custom UI widgets in the Command Deck.
  codebase_analysis: |
    Files to delete (12 files):
    - frontend/src/components/SkillsPalette.tsx, .module.css, .test.tsx
    - frontend/src/components/SkillsBanner.tsx, .module.css, .test.tsx
    - frontend/src/components/SkillsInstallDialog.tsx, .test.tsx
    - frontend/src/components/SlashCommandAutocomplete.tsx, .module.css, .test.tsx
    - frontend/src/hooks/useSkillsStatus.ts
    - frontend/src/hooks/useSkillsPrompt.ts
    - frontend/src/skills/registry.ts, registry.test.ts

    Files to modify:
    - frontend/src/App.tsx — imports, state (showSkillsPalette, skillsPrompt),
      handleSkillSelect, SkillsBanner JSX, Skills nav button, SkillsPalette JSX,
      SkillsInstallDialog JSX, 412 error handling in spawnMutation
    - frontend/src/pages/ProjectPage.tsx — skillsMissing logic, SetupBanners skills
      section, SkillsInstallDialog, useSkillsPrompt, 412 handling, onSkillsRequired
    - frontend/src/components/AgentTerminal.tsx — SKILL_REGISTRY import, autocomplete
      state (acIndex, acDismissed, acVisible, acFiltered), SlashCommandAutocomplete JSX,
      keyboard handling for autocomplete
    - frontend/src/components/AgentLauncher.tsx — SKILL_REGISTRY import, role filtering
      (decouple from skills registry, keep role selection)
    - frontend/src/api/queryKeys.ts — remove "skills" key
    - frontend/src/types/api.ts — remove SkillDetail, SkillsStatus types
  acceptance_criteria:
    - "SkillsPalette, SkillsBanner, SkillsInstallDialog, and SlashCommandAutocomplete components are fully removed"
    - "No 'Skills' button in the navigation header"
    - "No skills-related hooks (useSkillsStatus, useSkillsPrompt) remain"
    - "No SKILL_REGISTRY or skills/registry module remains"
    - "AgentTerminal chat input works without autocomplete (slash commands handled by Claude natively)"
    - "AgentLauncher role selection still works (decoupled from SKILL_REGISTRY)"
    - "ProjectPage spawn/setup flows work without skillsMissing checks or 412 skills handling"
    - "npm run build succeeds with no errors"
    - "Existing tests pass (no regressions from removed test files)"
  out_of_scope: |
    - Backend skills API endpoints (GET /api/skills, POST /api/skills/update) — left for separate cleanup
    - OpenAPI schema changes for skills endpoints
    - Any changes to how Claude Code handles slash commands in the terminal
  technical_notes: |
    Pure frontend deletion/cleanup. No new code — only removing dead code paths.
    AgentLauncher needs its role list decoupled from SKILL_REGISTRY — either inline
    the role definitions or accept them as props. The AgentRole type re-export from
    AgentLauncher should be preserved (it comes from api.ts SpawnInteractiveRequest).
