  technical_notes: |
    Approach:
    1. Fix the error first (TourProvider.test.tsx variable reassignment)
    2. Address complexity warnings by extracting sub-components (e.g., AgentDetailPage
       can split log viewer, status panel, and action bar into separate components)
    3. Fix setState-in-effect by using lazy initializers or restructuring
    4. For warnings that cannot be cleanly fixed, add targeted eslint-disable with
       a comment explaining why
