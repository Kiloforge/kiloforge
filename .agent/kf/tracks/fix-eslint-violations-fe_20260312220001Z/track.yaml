spec:
  summary: |
    Fix 1 ESLint error (variable reassignment in test file) and address 37 ESLint
    warnings across complexity, setState-in-effect, and fast-refresh categories.
  context: |
    Running `eslint src/` reports 38 problems: 1 error and 37 warnings. The error
    blocks strict CI gates. The warnings indicate code quality issues that should
    be addressed to keep the codebase healthy.
  codebase_analysis: |
    Error (1):
      - src/components/tour/TourProvider.test.tsx:29 — Cannot reassign variable
        `capturedPathname` declared outside the component/hook. The LocationSpy
        component reassigns a module-level `let` variable. Fix: use a ref or
        a mutable container object instead.

    Warnings by category:
      1. Complexity (3 warnings):
         - src/pages/AgentDetailPage.tsx:29 — complexity 52 (max 15)
         - src/pages/OverviewPage.tsx:124 — complexity 23 (max 15)
         - src/pages/ProjectPage.tsx:38 — complexity 46 (max 15)
         Fix: extract sub-components or helper functions to reduce branching.

      2. setState-in-effect (2 warnings):
         - src/hooks/useMediaQuery.ts:14 — setMatches(mq.matches) in effect body
         - src/pages/AgentDetailPage.tsx:64 — setLogLoading(false) in effect body
         Fix: use lazy initializer for useState, or restructure effect logic.

      3. fast-refresh/only-export-components (1 warning):
         - src/main.tsx:47 — file has exports but also non-component code
         Fix: move the component to a separate file.

      4. Remaining warnings (31): various instances of the above patterns plus
         minor issues. Full list available via `eslint src/`.
  acceptance_criteria:
    - "`npx eslint src/` reports zero errors"
    - "Complexity warnings in AgentDetailPage, OverviewPage, and ProjectPage are resolved or suppressed with justification"
    - "setState-in-effect warnings in useMediaQuery and AgentDetailPage are resolved"
    - "All existing tests continue to pass"
  out_of_scope: |
