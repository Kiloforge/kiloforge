id: fix-terminal-resume-reconnect-fe_20260313012400Z
title: Fix floating AgentTerminal WS reconnect on agent resume
type: bug
status: pending
created: '2026-03-13'
updated: '2026-03-13'
spec:
  summary: >
    Pass server-side agent status to floating AgentTerminal so it detects
    terminal→running transitions and calls reconnect(), fixing the bug where
    resumed agents never reconnect in floating terminal windows.
  context: |
    When an interactive agent is stopped, the WebSocket hook receives a terminal
    status message and stops auto-reconnecting. When the user later clicks
    "Resume", the backend creates a new SDK bridge and registers it with the
    SessionManager. However, the floating AgentTerminal (rendered in App.tsx)
    has no mechanism to detect the server-side status change and trigger
    reconnect().

    The AgentDetailPage's TerminalSection already has this fix — it receives
    a `serverStatus` prop and watches for terminal→non-terminal transitions
    via a useEffect that calls reconnect(). But the floating AgentTerminal
    component does not receive any server-side status prop.

    The SSE `agent_update` events already update the React Query cache for
    agents, so the status data IS available in the parent (App.tsx) — it just
    isn't passed through to AgentTerminal.
  codebase_analysis: |
    Key files:
    - frontend/src/components/AgentTerminal.tsx — Props interface has no serverStatus; relies solely on WS agentStatus
    - frontend/src/hooks/useAgentWebSocket.ts — Has reconnect() method; stops auto-reconnect on terminal status
    - frontend/src/App.tsx (lines 282-300) — Renders AgentTerminal from wm.getWindows() entries; no status prop passed
    - frontend/src/hooks/useWindowManager.ts — WindowEntry has no status field
    - frontend/src/hooks/useAgents.ts — SSE agent_update handler updates React Query cache with live agent status
    - frontend/src/pages/AgentDetailPage.tsx (lines 330-349) — TerminalSection has working pattern: watches serverStatus transitions → calls reconnect()

    The fix pattern already exists in TerminalSection. The task is to:
    1. Add serverStatus to AgentTerminal props
    2. Add the same terminal→non-terminal transition detection useEffect
    3. In App.tsx, look up the agent's current status from the agents query data and pass it as a prop
  acceptance_criteria:
    - After stopping an interactive agent and clicking Resume, the floating AgentTerminal reconnects automatically within 2 seconds
    - Messages from the resumed session appear in the terminal without requiring page refresh or window close/reopen
    - Existing AgentDetailPage TerminalSection resume flow continues to work
    - All existing AgentTerminal and useAgentWebSocket tests pass
  out_of_scope: |
    - Backend changes (resume endpoint and bridge lifecycle work correctly)
    - Developer (non-interactive) agent resume flow
    - AgentDetailPage TerminalSection (already fixed)
  technical_notes: |
    Approach:
    1. Add optional `serverStatus` prop to AgentTerminal Props interface
    2. In AgentTerminal, add the same useEffect pattern from TerminalSection:
       watch serverStatus transitions from terminal→non-terminal and call reconnect()
    3. In App.tsx, resolve the agent's current status from the useAgents() query
       data (which is kept live via SSE) and pass it to each AgentTerminal instance
    4. WindowEntry may need a status field, or App.tsx can look up status directly
       from the agents array when rendering

    The TERMINAL_STATUSES set is already defined in AgentTerminal.tsx (line 10).
    The reconnect() function is already returned by useAgentWebSocket.
